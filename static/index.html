<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles.css" />
    <title>Keepr</title>
  </head>
  <body>
    <main class="app-layout" id="appLayout">
      <section class="home-panel">
        <div class="page-shell">
          <section class="hero">
            <p class="eyebrow">LOCAL DOCUMENT VAULT</p>
            <h1>Keepr</h1>
            <p class="intro">
              A private place to store, organise, and find important documents.
            </p>

            <div class="file-checker">
              <label class="file-label" for="documentInput"
                >Choose a sample document</label
              >
              <input id="documentInput" type="file" accept=".pdf,image/*" />
              <button id="viewDocumentsButton" type="button">
                View documents
              </button>
            </div>

            <section class="saved-documents">
              <div class="documents-header">
                <span>Document</span>
                <span>Type</span>
                <span>Saved At</span>
              </div>

              <div id="documentsList" class="documents-list">
                <p class="empty-state">No saved documents yet.</p>
              </div>
            </section>
          </section>
        </div>
      </section>

      <section id="documentPanel" class="documents-panel">
        <div class="documents-panel-header">
          <h2>Documents</h2>
          <p>View or download files saved in Keepr.</p>
        </div>
        
        <div class="documents-search">
          <input id="documentsSearchInput" type="text" placeholder="Search by name, owner, type or tag..."/>
        </div>

        <div class="documents-header">
          <span>Document</span>
          <span>Type</span>
          <span>Action</span>
        </div>

        <div id="allDocumentsList" class="documents-list">
          <p class="empty-state">No documents saved yet.</p>
        </div>
      </section>
    </main>

    <div id="documentModal" class="modal-overlay" hidden>
      <div class="document-modal">
        <p class="modal-eyebrow">
          Save document
        </p>
        <h2>Add document details</h2>
        <p id="modalFileName" class="modal-file-name">Selected file</p>

        <div class="modal-fields">
          <label>
            Vault name (optional)
            <input id="displayNameInput" type="text" placeholder="UOB fees 2026"/>
          </label>

          <label>
            Owner (optional)
            <input id="ownerNameInput" type="text" placeholder="Enter owner name..."/>
          </label>

          <label>
            Document type (optional)
            <input id="documentTypeInput" type="text" placeholder="Passport, License, Aadhaar"/>
          </label>

          <label>
            Tags / nicknames (optional)
            <input id="tagsInput" type="text" placeholder="pp, F-stat, old passport"/>
          </label>
        </div>

        <div class="modal-actions">
          <button id="cancelModalButton" type="button">Cancel</button>
          <button id="modalSaveButton" type="button">Save document</button>
        </div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
