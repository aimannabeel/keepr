<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/styles.css">
  <title>Keepr</title>
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <p class="eyebrow">LOCAL DOCUMENT VAULT</p>
      <h1>Keepr</h1>
      <p class="intro">A private place to store, organise, and find important documents.</p>


      <div class="file-checker">
        <label class="file-label" for="documentInput">Choose a sample document</label>
        <input id="documentInput" type="file" accept=".pdf,image/*">
        <button id="saveDocumentButton" type="button" disabled>Save Document</button>

        <p id="fileDetails">No file selected yet</p>
      </div>
        
      <section class="saved-documents">
        <div class="documents-header">
          <span>Document</span>
          <span>Type</span>
          <span>Saved At</span>
        </div>

        <div id="documentsList" class="documents-list">
          <p class="empty-state">No saved documents yet.</p>
        </div>
        </section>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
